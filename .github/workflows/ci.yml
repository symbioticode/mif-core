name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development tools
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install --only-binary=:all: --timeout 60 --retries 2 -e '.[dev]'
      - name: Verify canonical DAL dependency
        run: python -c "from dal.core.handoff import DALHandoff; print(DALHandoff.__name__)"
      - name: Run tests
        run: python -m pytest --cov=core --cov-report=term-missing --cov-fail-under=90
      - name: Run type checks
        run: python -m mypy core tests examples
      - name: Run lint checks
        run: python -m ruff check core tests examples
      - name: Check formatting
        run: python -m ruff format --check core tests examples
      - name: Build distributions
        if: matrix.python-version == '3.12'
        run: python -m build
      - name: Verify distribution metadata
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pip check
          python -c "from importlib.metadata import version; assert version('mif-foundation') == '0.2.0'"
          test "$(mif-core --version)" = "0.2.0"
          test -f dist/mif_foundation-0.2.0-py3-none-any.whl
          test -f dist/mif_foundation-0.2.0.tar.gz
