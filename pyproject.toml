[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mif-foundation"
version = "0.1.0"
description = "Metric and strategy qualification layer for the Metric Integrity Framework"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [{name = "Symbioticode"}]
keywords = ["metric-integrity", "strategy-validation", "quantitative-finance", "mif"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["mif-dal>=0.1.0,<1.0.0"]

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.9.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/symbioticode/mif-core"
Repository = "https://github.com/symbioticode/mif-core"
Issues = "https://github.com/symbioticode/mif-core/issues"

[project.scripts]
mif-core = "core.cli:main"

[tool.setuptools]
packages = ["core", "core.metric", "core.strategy", "core.testing", "core.certification", "core.integrations"]

[tool.setuptools.package-data]
core = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF", "BLE001", "TRY004"]

[tool.mypy]
python_version = "3.11"
# The 0.1 adapter boundary accepts dynamic third-party handoffs. Keep gradual
# typing until those public protocols are modeled without replacing them by Any.
strict = false
check_untyped_defs = true
ignore_missing_imports = true
